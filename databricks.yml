bundle:
  name: travel-vista-azure-databricks

workspace:
  root_path: /Workspace/Shared/${bundle.name}

artifacts:
  default:
    type: whl
    path: .

resources:
  jobs:
    travel_vista_realtime_pipeline:
      name: travel-vista-realtime-pipeline
      tasks:
        - task_key: bronze_ingest
          existing_cluster_id: ${var.cluster_id}
          notebook_task:
            notebook_path: ./databricks/notebooks/01_bronze_ingest
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              checkpoint_root: ${var.checkpoint_root}
              event_source_mode: ${var.event_source_mode}
              raw_events_path: ${var.raw_events_path}
              eventhubs_secret_scope: ${var.eventhubs_secret_scope}
              eventhubs_secret_key: ${var.eventhubs_secret_key}
              bronze_table: travel_vista_bronze_events
        - task_key: silver_transform
          depends_on:
            - task_key: bronze_ingest
          existing_cluster_id: ${var.cluster_id}
          notebook_task:
            notebook_path: ./databricks/notebooks/02_silver_transform
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              checkpoint_root: ${var.checkpoint_root}
              bronze_table: travel_vista_bronze_events
              silver_table: travel_vista_silver_visits
        - task_key: gold_aggregates
          depends_on:
            - task_key: silver_transform
          existing_cluster_id: ${var.cluster_id}
          notebook_task:
            notebook_path: ./databricks/notebooks/03_gold_aggregates
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              checkpoint_root: ${var.checkpoint_root}
              silver_table: travel_vista_silver_visits
              destination_table: travel_vista_gold_destination_hourly
              region_table: travel_vista_gold_region_daily

targets:
  dev:
    default: true
    workspace:
      host: ${var.databricks_host}

variables:
  databricks_host:
    description: Databricks workspace host URL
  cluster_id:
    description: Existing Azure Databricks cluster ID
  catalog:
    default: main
  schema:
    default: travel_vista
  checkpoint_root:
    default: dbfs:/tmp/travel_vista/checkpoints
  event_source_mode:
    default: eventhubs
  raw_events_path:
    default: abfss://raw@travelvistastorage.dfs.core.windows.net/travel-vista/events
  eventhubs_secret_scope:
    default: travel-vista-kv
  eventhubs_secret_key:
    default: eventhub-connection-string
